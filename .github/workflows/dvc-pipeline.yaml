name: HYDROSIGHT DVC Pipeline

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Validate the existing snapshots or publish validated DVC results for review"
        type: choice
        required: true
        default: validate
        options:
          - validate
          - publish
  # Only source changes that affect the tracked DVC pipeline trigger remote validation.
  push:
    branches: [main]
    paths:
      - .github/workflows/dvc-pipeline.yaml
      - .dvc/config
      - scripts/verify_dvc_pipeline.sh
      - dvc.yaml
      - dvc.lock
      - data/**/*.dvc
      - data/processed/spatial_grid_manifest.json
      - src/hydrosight/main.py
      - src/hydrosight/preprocessing/**

concurrency:
  group: hydrosight-dvc-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Verify real-data DVC pipeline
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'validate') ||
      (github.event_name == 'push' && vars.HYDROSIGHT_DVC_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.HYDROSIGHT_GDRIVE_OAUTH_JSON }}
    steps:
      - name: Checkout tracked project state
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pipeline dependencies
        run: python -m pip install "dvc[gdrive]" pytest numpy pandas geopandas shapely

      - name: Reproduce and validate the real-data pipeline
        run: bash scripts/verify_dvc_pipeline.sh validate

      - name: Require reviewed DVC lock metadata
        run: |
          if ! git diff --quiet -- dvc.lock; then
            echo "::error::Reproduction changed dvc.lock; use the publish operation to open a review PR."
            exit 1
          fi

      - name: Inspect remote synchronization (read-only)
        run: dvc status -c

  publish:
    name: Publish DVC artifacts and open review PR
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'publish' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.HYDROSIGHT_GDRIVE_OAUTH_JSON }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the canonical main branch
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pipeline dependencies
        run: python -m pip install "dvc[gdrive]" pytest numpy pandas geopandas shapely

      - name: Reproduce and validate before publishing
        run: bash scripts/verify_dvc_pipeline.sh publish

      - name: Check whether DVC metadata actually changed
        id: dvc_changes
        run: |
          if git diff --quiet -- dvc.lock data/pipeline/.gitignore; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "DVC metadata is unchanged; skip publication."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish new versioned data to the existing DVC remote
        if: steps.dvc_changes.outputs.changed == 'true'
        run: |
          dvc push
          dvc status -c

      - name: Open PR for changed DVC metadata (never auto-merge)
        if: steps.dvc_changes.outputs.changed == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git add -- dvc.lock data/pipeline/.gitignore
          if git diff --cached --quiet; then
            echo "Tracked DVC metadata is unchanged: no pull request needed."
            exit 0
          fi
          branch="automation/dvc-${RUN_ID}-${RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "chore(dvc): update validated HYDROSIGHT pipeline outputs"
          git push origin "$branch"
          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$branch" \
            --title "chore(dvc): review updated HYDROSIGHT pipeline outputs" \
            --body "Generated by the manually approved DVC publish workflow. All existing real-data pipeline stages and automated tests completed successfully. Content-addressed DVC outputs have been pushed to the configured Google Drive remote. Review dvc.lock and the data quality summary before merging. No new source observations were downloaded or inferred by this run."
